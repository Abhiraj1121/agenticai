<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found · EKA</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='16' fill='%23C9A84C'/><path d='M16 8 L18.2 13.8 L24 16 L18.2 18.2 L16 24 L13.8 18.2 L8 16 L13.8 13.8 Z' fill='%230C0608'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#C9A84C; --gold-bright:#F0D080; --gold-dim:#8A6E30;
    --gold-glow:rgba(201,168,76,0.28); --gold-edge:rgba(201,168,76,0.16);
    --ink:#08050A; --ink2:#0E0810; --ink3:#16101C;
    --surface:rgba(22,16,28,0.72); --surface-edge:rgba(255,255,255,0.06);
    --text:#EDE8E0; --text2:#A89E88; --text3:#6A6055;
    --font-display:'Cinzel',serif; --font-body:'Rajdhani',sans-serif; --font-mono:'JetBrains Mono',monospace;
  }
  *,*::before,*::after{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; width:100%; background:var(--ink); font-family:var(--font-body); color:var(--text); -webkit-font-smoothing:antialiased; }
  body{
    display:flex; align-items:center; justify-content:center; min-height:100dvh; padding:24px;
    position:relative; overflow-x:hidden;
    background:
      radial-gradient(ellipse 90% 60% at 50% -10%, rgba(201,168,76,0.10), transparent 60%),
      radial-gradient(ellipse 70% 50% at 85% 110%, rgba(167,120,250,0.06), transparent 60%),
      linear-gradient(180deg, #08050A 0%, #0C0710 50%, #08050A 100%);
  }
  #bgCanvas{ position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; }

  .stage{ position:relative; z-index:10; width:min(520px, 100%); }
  .card{
    position:relative; text-align:center; overflow:hidden;
    background:var(--surface); backdrop-filter:blur(18px) saturate(140%); -webkit-backdrop-filter:blur(18px) saturate(140%);
    border:1px solid var(--surface-edge); border-radius:26px; padding:52px 40px 40px;
    box-shadow:0 30px 80px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.02) inset, 0 1px 0 rgba(255,255,255,0.06) inset;
  }
  .card::before{
    content:''; position:absolute; inset:0; border-radius:26px; padding:1px;
    background:linear-gradient(135deg, var(--gold-edge), transparent 30%, transparent 70%, var(--gold-edge));
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude; pointer-events:none;
  }

  .orb-wrap{ width:104px; height:104px; margin:0 auto 26px; position:relative; animation:orbFloat 5s ease-in-out infinite; }
  @keyframes orbFloat{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-9px); } }
  .ring{ position:absolute; border-radius:50%; border:1.5px solid var(--gold-edge); }
  .ring.r1{ inset:0; border-color:rgba(201,168,76,0.45); animation:spin 9s linear infinite; }
  .ring.r2{ inset:12px; border-color:rgba(201,168,76,0.3); animation:spin 7s linear infinite reverse; }
  @keyframes spin{ from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }
  .orb-core{
    position:absolute; inset:26px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--gold-bright), var(--gold) 55%, var(--gold-dim) 100%);
    box-shadow:0 0 30px var(--gold-glow), inset -4px -6px 10px rgba(0,0,0,0.35), inset 3px 4px 8px rgba(255,255,255,0.35);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:700; font-size:22px; color:var(--ink);
  }

  .eyebrow{
    font-family:var(--font-mono); font-size:11px; letter-spacing:0.32em; text-transform:uppercase;
    color:var(--gold); opacity:0.85; margin-bottom:14px; display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .eyebrow .dot{ width:6px; height:6px; border-radius:50%; background:var(--gold); box-shadow:0 0 8px var(--gold); animation:blink 1.6s ease-in-out infinite; }
  @keyframes blink{ 0%,100%{ opacity:1; } 50%{ opacity:0.25; } }

  h1.code{
    font-family:var(--font-display); font-weight:800; font-size:56px; letter-spacing:0.08em;
    background:linear-gradient(135deg, var(--gold-bright), var(--gold) 55%, var(--gold-dim));
    -webkit-background-clip:text; background-clip:text; color:transparent; line-height:1; margin-bottom:12px;
  }
  h2.headline{ font-family:var(--font-display); font-weight:600; font-size:19px; letter-spacing:0.04em; color:var(--text); margin-bottom:14px; }
  p.body-text{ font-size:15px; line-height:1.65; color:var(--text2); font-weight:500; max-width:380px; margin:0 auto 30px; }

  .actions{ display:flex; flex-direction:column; gap:12px; align-items:center; }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    font-family:var(--font-body); font-weight:700; font-size:14.5px; letter-spacing:0.02em;
    padding:12px 26px; border-radius:999px; cursor:pointer; text-decoration:none;
    transition:transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
  }
  .btn-solid{ background:linear-gradient(135deg, var(--gold-bright), var(--gold) 60%, var(--gold-dim)); color:var(--ink); border:none; }
  .btn-solid:hover{ box-shadow:0 10px 26px var(--gold-glow); transform:translateY(-1px); }
  .btn-outline{ background:transparent; color:var(--text2); border:1px solid var(--surface-edge); }
  .btn-outline:hover{ color:var(--text); border-color:var(--gold-edge); }

  footer.note{
    margin-top:26px; padding-top:18px; border-top:1px solid var(--surface-edge);
    font-family:var(--font-mono); font-size:10.5px; color:var(--text3); letter-spacing:0.06em;
  }

  @media (max-width:480px){
    .card{ padding:40px 24px 32px; border-radius:20px; }
    h1.code{ font-size:44px; }
    .orb-wrap{ width:88px; height:88px; }
    .orb-core{ inset:22px; font-size:18px; }
  }
  @media (prefers-reduced-motion:reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div class="stage">
  <div class="card">
    <div class="orb-wrap">
      <div class="ring r1"></div>
      <div class="ring r2"></div>
      <div class="orb-core">EKA</div>
    </div>

    <div class="eyebrow"><span class="dot"></span> Lost in the ether</div>

    <h1 class="code">404</h1>
    <h2 class="headline">This page doesn't exist.</h2>
    <p class="body-text">
      The link may be broken, or the page may have moved.
      Let's get you back to somewhere useful.
    </p>

    <div class="actions">
      <a class="btn btn-solid" href="./" >
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
        Back to Home
      </a>
      <a class="btn btn-outline" href="./" onclick="if(window.history.length>1){history.back();return false;}">
        Go Back
      </a>
    </div>

    <footer class="note">EKA AI · Error 404</footer>
  </div>
</div>

<script>
  const canvas = document.getElementById('bgCanvas');
  const ctx = canvas.getContext('2d');
  let w, h, particles;
  function resize(){ w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
  window.addEventListener('resize', resize);
  resize();
  function initParticles(){
    const count = Math.min(90, Math.floor((w*h)/16000));
    particles = Array.from({length: count}, () => ({
      x: Math.random()*w, y: Math.random()*h, z: Math.random()*1 + 0.2,
      r: Math.random()*1.6 + 0.4, vy: (Math.random()*0.15 + 0.03), tw: Math.random()*Math.PI*2
    }));
  }
  initParticles();
  window.addEventListener('resize', initParticles);
  function drawParticles(){
    ctx.clearRect(0,0,w,h);
    for(const p of particles){
      p.tw += 0.02;
      const alpha = 0.25 + Math.abs(Math.sin(p.tw))*0.5;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r*p.z, 0, Math.PI*2);
      ctx.fillStyle = `rgba(201,168,76,${alpha*p.z})`; ctx.fill();
      p.y -= p.vy;
      if(p.y < -5){ p.y = h+5; p.x = Math.random()*w; }
    }
    requestAnimationFrame(drawParticles);
  }
  drawParticles();
</script>

</body>
</html>
